app = "awx-shredder"
primary_region = "ams"

[env]
NODE_ENV = "production"
PORT = "3000"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
type = "connections"
hard_limit = 250
soft_limit = 200

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
